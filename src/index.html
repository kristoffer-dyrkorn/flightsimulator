<!doctype html>
<html lang="en">
  <head>
    <title>Flight</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
  </head>
  <body style="margin: 0; overflow: hidden; background-color: #333" ;>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R83Q8MQXT4"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag("js", new Date())
      gtag("config", "G-R83Q8MQXT4")
    </script>
    <div id="buttoncontainer" style="display: flex; justify-content: center; align-items: center; height: 100vh">
      <button
        id="start"
        style="
          background-color: #555;
          color: #aaa;
          border-color: #555;
          border-radius: 10px;
          font-size: 40px;
          padding: 10px 20px;
          border: 0;
        "
      >
        START
      </button>
    </div>
    <!-- shown when the aircraft crashes, over the scene where it did - why, and
         the values behind it, filled in by js/crashReport.js -->
    <div
      id="crash"
      style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(51, 51, 51, 0.85);
        font-family: Verdana, sans-serif;
      "
    >
      <div
        id="crashreason"
        style="color: #ccc; font-size: 22px; text-align: center; max-width: 90vw"
      ></div>
      <ul
        id="crashdetails"
        style="color: #999; font-size: 18px; list-style: none; padding: 0; margin: 12px 0 0; text-align: center"
      ></ul>
      <div style="display: flex; gap: 24px; margin-top: 40px">
        <button
          id="crashreplay"
          style="background-color: #555; color: #aaa; border-radius: 10px; font-size: 40px; padding: 10px 20px; border: 0"
        >
          REPLAY
        </button>
        <button
          id="flyagain"
          style="background-color: #555; color: #aaa; border-radius: 10px; font-size: 40px; padding: 10px 20px; border: 0"
        >
          FLY AGAIN
        </button>
      </div>
    </div>
    <!-- the replay's player: to the beginning, play/pause, to the end, and a
         timeline to click or drag along - see the replay in js/index.js -->
    <div
      id="replaycontrols"
      style="
        display: none;
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font: 12px Verdana, sans-serif;
        color: #ddd;
      "
    >
      <button id="replaybeginning" title="To the beginning" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: #555; color: #ddd; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="currentColor"><rect x="2" y="3" width="2.5" height="12" /><path d="M16 3v12L6 9z" /></svg>
      </button>
      <button id="replayplay" title="Play / pause" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: #555; color: #ddd; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg id="replayplayicon" width="14" height="14" viewBox="0 0 18 18" fill="currentColor"><path d="M4 2v14l12-7z" /></svg>
        <svg id="replaypauseicon" width="14" height="14" viewBox="0 0 18 18" fill="currentColor" style="display: none"><rect x="3" y="2" width="4" height="14" /><rect x="11" y="2" width="4" height="14" /></svg>
      </button>
      <button id="replayend" title="To the end" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: #555; color: #ddd; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="currentColor"><path d="M2 3v12l10-6z" /><rect x="13.5" y="3" width="2.5" height="12" /></svg>
      </button>
      <div id="replaytimeline" style="position: relative; width: min(420px, 45vw); height: 16px; cursor: pointer">
        <div style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: #666"></div>
        <div id="replayprogress" style="position: absolute; left: 0; width: 0; top: 6px; height: 4px; border-radius: 2px; background: #ddd"></div>
        <div id="replayhandle" style="position: absolute; left: 0; top: 2px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff"></div>
      </div>
      <div id="replayclock" style="min-width: 90px; text-align: right; font-variant-numeric: tabular-nums"></div>
    </div>
    <canvas id="webgl" style="display: none"></canvas>
    <canvas id="hud" style="display: none"></canvas>
    <script type="module" src="js/index.js"></script>
    <div
      style="
        position: absolute;
        bottom: 0;
        right: 0;
        margin-right: 5px;
        color: #aaa;
        font-family: sans-serif;
        font-size: 12px;
      "
      id="attribution"
    >
      Terrain: Kartverket Imagery: Kartverket and Copernicus Sentinel-2 data (2022), processed by Kartverket Wind data:
      MET Norway Roads and buildings:
      <a style="color: #aaa" href="https://openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer"
        >OpenStreetMap</a
      >, <a style="color: #aaa" href="https://overturemaps.org" target="_blank" rel="noopener noreferrer">Overture Maps</a>
    </div>
  </body>
</html>
